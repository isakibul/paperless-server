<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gradient Hero Banner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      .hero {
        position: relative;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        overflow: hidden;
        background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
        background-size: cover;
        background-position: center;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 60, 120, 0.75),
          rgba(255, 170, 60, 0.75)
        );
        z-index: 1;
      }

      .hero-content {
        position: relative;
        z-index: 2;
      }

      .hero h1 {
        font-size: 42px;
        margin-bottom: 10px;
      }

      .hero p {
        font-size: 16px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h1>About Us 1</h1>
        <p>Home &nbsp; > &nbsp; About Us 1</p>
      </div>
    </section>
  </body>
</html>
